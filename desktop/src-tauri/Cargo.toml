[package]
name = "qynl-desktop"
version = "1.0.0"
description = "Qynl BedWars private training control center"
authors = ["Qynl"]
edition = "2021"

[lib]
name = "qynl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
